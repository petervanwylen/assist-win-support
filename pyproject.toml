[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Not wired into CI: this is the configuration a wheel-publishing workflow would
# use, so that win_amd64 wheels can be enabled later without revisiting the
# build. Until then `pip install assist` builds from source on Windows and needs
# the Visual Studio Build Tools (see the README). The Python range is bounded by
# REBOUND, which publishes win_amd64 wheels for CPython 3.10-3.12 only.

[tool.cibuildwheel]
build-frontend = "build"
before-build = "pip install \"rebound>=4.4.11,<5.0.0\" numpy"
test-command = "python -c \"import assist; print(assist.__version__)\""

[tool.cibuildwheel.windows]
archs = ["AMD64"]
build = ["cp310-win_amd64", "cp311-win_amd64", "cp312-win_amd64"]

# ASSIST links against librebound*.pyd from the REBOUND wheel, which is not
# vendored into the ASSIST wheel; REBOUND is a runtime dependency and supplies
# it in site-packages. delvewheel would otherwise try to bundle a copy.
repair-wheel-command = ""
